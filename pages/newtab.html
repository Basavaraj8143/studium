<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New Tab – Studium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    /* ===== DESIGN TOKENS ===== */
    :root {
      --bg-base: #f6f8fa;
      --bg-surface: #ffffff;
      --bg-raised: #eef1f4;
      --bg-highlight: #e2e6ea;
      --border: #d0d7de;
      --border-muted: #e6e9ed;
      --text-primary: #1a1f2e;
      --text-secondary: #586069;
      --text-muted: #9aa4b0;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --accent-glow: rgba(37,99,235,0.18);
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.07);
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.14);
    }

    /* ===== DARK THEME ===== */
    :root.dark {
      --bg-base: #0d1117;
      --bg-surface: #161b22;
      --bg-raised: #21262d;
      --bg-highlight: #30363d;
      --border: #30363d;
      --border-muted: #21262d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #484f58;
      --accent: #58a6ff;
      --accent-light: #092f59;
      --accent-glow: rgba(88,166,255,0.18);
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
      --shadow-lg: 0 12px 40px rgba(0,0,0,0.6);
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.15s ease, color 0.15s ease;
    }

    /* ===== SUBTLE BACKGROUND ===== */
    .bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* Very subtle dot grid */
    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(37,99,235,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* Soft blue orb top-left */
    .orb-1 {
      position: absolute;
      width: 500px; height: 500px;
      top: -180px; left: -120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);
      animation: orbFloat 10s ease-in-out infinite;
    }

    /* Soft indigo orb bottom-right */
    .orb-2 {
      position: absolute;
      width: 420px; height: 420px;
      bottom: -150px; right: -100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.07) 0%, transparent 70%);
      animation: orbFloat 12s 4s ease-in-out infinite;
    }

    @keyframes orbFloat {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    /* ===== MAIN ===== */
    .main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    /* ===== CLOCK ===== */
    #clock {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: -3px;
      color: var(--text-primary);
      line-height: 1;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.55s ease forwards;
    }

    /* ===== GREETING ===== */
    #greeting {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
      margin-top: -14px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s 0.1s ease forwards;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== SEARCH ===== */
    .search-wrap {
      width: 100%;
      max-width: 540px;
      padding: 0 20px;
      position: relative;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s 0.2s ease forwards;
    }

    .search-icon {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      color: #9aa4b0;
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .search-icon svg { width: 16px; height: 16px; }

    #search {
      width: 100%;
      padding: 12px 18px 12px 42px;
      font-size: 14px;
      font-family: inherit;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-primary);
      outline: none;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow), var(--shadow-sm);
    }
    #search::placeholder { color: var(--text-muted); }

    /* ===== SUGGESTIONS ===== */
    .suggestions {
      position: absolute;
      top: 100%;
      left: 20px;
      right: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      max-height: 280px;
      overflow-y: auto;
      z-index: 100;
      margin-top: 8px;
    }

    .suggestions.hidden {
      display: none;
    }

    .suggestion-item {
      padding: 10px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-muted);
      transition: background-color 0.15s;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover,
    .suggestion-item.selected {
      background-color: var(--bg-raised);
    }

    .suggestion-item.selected {
      background-color: var(--accent-light);
    }

    .suggestion-icon {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .suggestion-icon svg { width: 14px; height: 14px; }

    .suggestion-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .suggestion-highlight {
      font-weight: 500;
      color: var(--accent);
    }

    /* ===== QUICK LINKS ===== */
    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 580px;
      padding: 0 20px;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeUp 0.55s 0.32s ease forwards;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }

    .link {
      width: 80px;
      min-height: 80px;
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      box-shadow: var(--shadow-xs);
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s, color 0.15s;
      user-select: none;
    }
    .link:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 14px var(--accent-glow);
      transform: translateY(-3px);
      color: var(--accent);
    }
    .link:hover svg { stroke: var(--accent); }

    .link svg { width: 22px; height: 22px; stroke: var(--text-secondary); transition: stroke 0.15s; }
    .link-label { line-height: 1; }

    /* ===== FOOTER ===== */
    .footer {
      position: fixed; bottom: 14px;
      font-size: 11px; color: #c9d0d8;
      letter-spacing: 1px; font-weight: 500;
      user-select: none; z-index: 1;
    }
  </style>
</head>

<body>

  <div class="bg-canvas">
    <div class="dot-grid"></div>
    <div class="orb-1"></div>
    <div class="orb-2"></div>
  </div>

  <div class="main">

    <div id="clock">00:00</div>
    <div id="greeting">Good morning</div>

    <div class="search-wrap">
      <span class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </span>
      <input type="text" id="search" placeholder="Search or enter URL" autofocus />
      <div id="suggestions" class="suggestions hidden"></div>
    </div>

    <div class="links">

      <!-- Google -->
      <div class="link" data-url="https://google.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span class="link-label">Google</span>
      </div>

      <!-- YouTube -->
      <div class="link" data-url="https://youtube.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/>
          <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/>
        </svg>
        <span class="link-label">YouTube</span>
      </div>

      <!-- GitHub -->
      <div class="link" data-url="https://github.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
        <span class="link-label">GitHub</span>
      </div>

      <!-- Gmail -->
      <div class="link" data-url="https://mail.google.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span class="link-label">Gmail</span>
      </div>

      <!-- GFG -->
      <div class="link" data-url="https://geeksforgeeks.org">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="link-label">GFG</span>
      </div>

      <!-- Wikipedia -->
      <div class="link" data-url="https://wikipedia.org">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span class="link-label">Wikipedia</span>
      </div>

    </div>
  </div>

  <div class="footer">STUDIUM</div>

  <script>
    // ===== CLOCK & GREETING =====
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = h + ':' + m;
    }

    function updateGreeting() {
      const h = new Date().getHours();
      const g = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
      document.getElementById('greeting').textContent = g;
    }

    updateClock();
    updateGreeting();
    setInterval(updateClock, 10000);

    // ===== NAVIGATION =====
    function navigate(value) {
      hideSuggestions();
      
      // Handle Google search fallback
      if (value.startsWith('Search Google for ')) {
        const query = value.replace('Search Google for "', '').replace('"', '');
        value = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        saveSearchHistory(query);
      }
      // Save to search history (only if it's a search query, not a URL)
      else if (value && !value.startsWith('http') && value.length > 2) {
        saveSearchHistory(value);
        value = `https://www.google.com/search?q=${encodeURIComponent(value)}`;
      }
      
      window.parent.postMessage({ type: 'NAVIGATE', url: value }, '*');
    }

    // Save search to history
    function saveSearchHistory(query) {
      const searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
      
      // Remove if already exists (to move to top)
      const index = searchHistory.indexOf(query);
      if (index > -1) {
        searchHistory.splice(index, 1);
      }
      
      // Add to beginning
      searchHistory.unshift(query);
      
      // Keep only last 20 searches
      if (searchHistory.length > 20) {
        searchHistory.splice(20);
      }
      
      localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
    }

    // ===== SEARCH SUGGESTIONS =====
    const searchInput = document.getElementById('search');
    const suggestionsDiv = document.getElementById('suggestions');
    let debounceTimer;
    let selectedIndex = -1;
    let currentSuggestions = [];

    // Debounced search function
    function debounceSearch(query) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        fetchSuggestions(query);
      }, 200); // 200ms delay
    }

    // Fetch suggestions from local study-focused database
    function fetchSuggestions(query) {
      if (query.length < 2) {
        hideSuggestions();
        return;
      }

      // Study-focused search suggestions
      const studySuggestions = [
        // Programming & Computer Science
        'javascript tutorial', 'python tutorial', 'react documentation', 'node.js guide',
        'data structures', 'algorithms', 'machine learning', 'artificial intelligence',
        'web development', 'frontend development', 'backend development', 'full stack',
        'leetcode problems', 'hackerrank', 'codeforces', 'github repository',
        
        // Academic & Research
        'research papers', 'academic journals', 'scholar articles', 'citation manager',
        'literature review', 'thesis writing', 'dissertation help', 'academic writing',
        'plagiarism checker', 'reference manager', 'bibliography generator',
        
        // Study Tools
        'note taking app', 'flashcard maker', 'mind mapping tool', 'pomodoro timer',
        'study planner', 'time management', 'focus techniques', 'concentration tips',
        
        // Online Learning
        'coursera courses', 'edx online', 'udemy tutorial', 'khan academy',
        'mit opencourseware', 'stanford online', 'youtube education', 'online lectures',
        
        // Science & Math
        'calculus help', 'linear algebra', 'physics problems', 'chemistry equations',
        'biology notes', 'statistics tutorial', 'probability theory', 'math formulas',
        
        // Common Searches
        'google scholar', 'wikipedia', 'stack overflow', 'reddit study',
        'quora questions', 'medium articles', 'dev blog', 'tutorial point'
      ];

      // Get search history from localStorage
      const searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
      
      // Combine and filter suggestions
      const allSuggestions = [...searchHistory, ...studySuggestions];
      const filteredSuggestions = allSuggestions
        .filter(suggestion => 
          suggestion.toLowerCase().includes(query.toLowerCase())
        )
        .slice(0, 7); // Limit to 7 local suggestions

      // Add Google search fallback if no exact matches
      if (filteredSuggestions.length === 0 || !filteredSuggestions.some(s => s.toLowerCase() === query.toLowerCase())) {
        filteredSuggestions.push(`Search Google for "${query}"`);
      }

      displaySuggestions(filteredSuggestions, query);
    }

    // Display suggestions in dropdown
    function displaySuggestions(suggestions, query) {
      currentSuggestions = suggestions;
      selectedIndex = -1;

      if (suggestions.length === 0) {
        hideSuggestions();
        return;
      }

      const html = suggestions.map((suggestion, index) => {
        const highlightedText = highlightMatch(suggestion, query);
        return `
          <div class="suggestion-item" data-index="${index}" data-suggestion="${suggestion}">
            <span class="suggestion-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </span>
            <span class="suggestion-text">${highlightedText}</span>
          </div>
        `;
      }).join('');

      suggestionsDiv.innerHTML = html;
      suggestionsDiv.classList.remove('hidden');

      // Add click listeners
      suggestionsDiv.querySelectorAll('.suggestion-item').forEach(item => {
        item.addEventListener('click', () => {
          navigate(item.dataset.suggestion);
        });
      });
    }

    // Highlight matching part of suggestion
    function highlightMatch(text, query) {
      const regex = new RegExp(`(${escapeRegex(query)})`, 'gi');
      return text.replace(regex, '<span class="suggestion-highlight">$1</span>');
    }

    // Escape regex special characters
    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Hide suggestions dropdown
    function hideSuggestions() {
      suggestionsDiv.classList.add('hidden');
      currentSuggestions = [];
      selectedIndex = -1;
    }

    // Update selected suggestion highlighting
    function updateSelection() {
      const items = suggestionsDiv.querySelectorAll('.suggestion-item');
      items.forEach((item, index) => {
        item.classList.toggle('selected', index === selectedIndex);
      });
    }

    // ===== EVENT LISTENERS =====
    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      if (query) {
        debounceSearch(query);
      } else {
        hideSuggestions();
      }
    });

    searchInput.addEventListener('keydown', (e) => {
      const items = suggestionsDiv.querySelectorAll('.suggestion-item');

      switch (e.key) {
        case 'Enter':
          e.preventDefault();
          if (selectedIndex >= 0 && items[selectedIndex]) {
            navigate(items[selectedIndex].dataset.suggestion);
          } else {
            navigate(searchInput.value);
          }
          break;

        case 'ArrowDown':
          e.preventDefault();
          if (items.length > 0) {
            selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
            updateSelection();
          }
          break;

        case 'ArrowUp':
          e.preventDefault();
          if (items.length > 0) {
            selectedIndex = Math.max(selectedIndex - 1, -1);
            updateSelection();
          }
          break;

        case 'Escape':
          hideSuggestions();
          searchInput.blur();
          break;
      }
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrap')) {
        hideSuggestions();
      }
    });

    // Quick links navigation
    document.querySelectorAll('.link').forEach(function(link) {
      link.addEventListener('click', function() { 
        navigate(link.dataset.url); 
      });
    });

    // Listen for theme changes from parent
    window.addEventListener('message', function(event) {
      if (event.data.type === 'THEME_CHANGE') {
        const isDark = event.data.isDark;
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }
    });

    // Request current theme from parent
    window.parent.postMessage({ type: 'REQUEST_THEME' }, '*');
  </script>

</body>
</html>
