<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Studium</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    #top-bar {
      padding: 10px;
      background: #f0f0f0;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    #url {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }

    button {
      padding: 6px 10px;
      cursor: pointer;
    }

    /* Tabs bar */
    #tabs-bar {
      padding: 6px 10px;
      background: #ddd;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #tabs {
      display: flex;
      gap: 6px;
      flex: 1;
      overflow: hidden;
    }

    .tab {
      flex: 1;                 /* all tabs take equal width */
      max-width: 160px;        /* hard cap so they don’t grow */
      min-width: 120px;        /* readable minimum */
      padding: 4px 8px;
      background: #bbb;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;

      display: flex;
      align-items: center;
      gap: 6px;

      overflow: hidden;
    }

    .tab.active {
      background: #888;
      color: #fff;
    }

    .tab .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;                 /* title shrinks, not close button */
    }

    .tab .close {
      flex-shrink: 0;
      font-weight: bold;
      cursor: pointer;
      color: #333;
    }

    .tab .close:hover {
      color: red;
    }

    .tab span {
      user-select: none;
    }

    .tab span:hover {
      opacity: 0.85;
    }

    #tab-info {
      font-size: 13px;
    }

    #study-indicator {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 6px 10px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.3px;
      display: none;
      z-index: 9999;
      cursor: pointer;
      overflow: visible;
    }

    #study-indicator .light {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      box-shadow:
        0 0 10px 6px rgba(255, 255, 255, 0.35),
        0 0 22px 12px rgba(200, 240, 255, 0.25),
        0 0 36px 18px rgba(150, 220, 255, 0.15);
      pointer-events: none;
    }

    #study-indicator.glow .light {
      animation: studyGlow 3.2s ease-in-out infinite;
    }

    @keyframes studyGlow {
      0% {
        opacity: 0.25;
        transform: translate(-50%, -50%) scale(0.6);
      }
      50% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1.8);
      }
      100% {
        opacity: 0.25;
        transform: translate(-50%, -50%) scale(0.6);
      }
    }

    /* Content */
    #content {
      flex: 1;
    }

    webview {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- Top controls -->
  <div id="top-bar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>

    <input id="url" placeholder="Enter URL like https://google.com" />

    <button onclick="loadURL()">Go</button>
    <button onclick="openPDF()">Open PDF</button>
    <button onclick="toggleStudyMode()">Study Mode</button>
    <button onclick="toggleReaderMode()">Reader Mode</button>
  </div>

  <!-- Restore Session Bar -->
  <div id="restore-bar" style="
    display: none;
    padding: 8px 12px;
    background: #fff3cd;
    border-bottom: 1px solid #ffeeba;
    font-size: 13px;
    align-items: center;
    gap: 10px;
  ">
    <span id="restore-text">Restore previous session?</span>
    <button onclick="restorePreviousSession()">Restore</button>
    <button onclick="startFresh()">Start Fresh</button>
    <button onclick="dismissRestoreBar()" style="margin-left: auto; background: none; border: none; font-size: 16px; cursor: pointer; color: #666;">×</button>
  </div>

  <button id="study-indicator" type="button" aria-label="Exit Study Mode">
    Study Mode
    <span class="light" aria-hidden="true"></span>
  </button>

  <!-- Tabs -->
  <div id="tabs-bar">
    <div id="tabs"></div>
    <button onclick="newTab()">+ New Tab</button>
    <span id="tab-info">Tabs: 1 / 5</span>
  </div>

  <!-- Webview -->
<div id="content"></div>

 

  <script src="renderer.js"></script>
</body>
</html>
